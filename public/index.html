<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light dark"><title>YouTube Summarizer</title><link rel="stylesheet" href="/style.css"></head><body><header><div class="header-title"><h1>YouTube Summarizer</h1><div class="backend-connection"><span id="backend-status" class="backend-status" data-state="checking" role="status" aria-live="polite">Checking backend…</span><button id="backend-retry" class="secondary" hidden>Retry</button></div></div><p>Private, local transcript summaries powered by Pi</p><p id="backend-help" class="backend-help" hidden>Backend unreachable — tap the Termux widget to start it again.</p></header><main><section class="card" id="new"><form id="inspect-form"><label for="url">YouTube video or Short</label><div class="row"><input id="url" type="url" inputmode="url" autocomplete="url" placeholder="https://youtu.be/…" required><button>Inspect</button></div></form><div id="notice" role="alert"></div><div id="inspection" hidden></div></section><section id="viewer" class="card" hidden></section><section><div class="section-head"><h2>History</h2><button id="refresh" class="secondary">Refresh</button></div><div id="history"></div></section></main><script src="/app.js" defer></script></body></html>
